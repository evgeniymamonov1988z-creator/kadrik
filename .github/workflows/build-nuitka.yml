name: Build Windows EXE (Nuitka)
# build trigger: 2026-10-04

# Сборка .exe через Nuitka на Windows.
# Nuitka компилирует Python в настоящий машинный код —
# это часто даёт меньше ложных срабатываний антивирусов, чем PyInstaller.

on:
  workflow_dispatch:        # кнопка "Запустить" вручную
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==4.2.2
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          $args = @(
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--enable-plugin=tk-inter',
            '--windows-icon-from-ico=icon.ico',
            # Metadata inside the .exe (empty fields look suspicious to AV)
            '--company-name=Evgeniy Mamonov',
            '--product-name=Kadrik',
            '--file-description=Kadrik by Evgeniy Mamonov',
            '--file-version=1.0.0.0',
            '--product-version=1.0.0.0',
            '--copyright=Copyright (c) Evgeniy Mamonov. All rights reserved.',
            '--trademarks=Kadrik (TM) Evgeniy Mamonov',
            '--include-data-files=updater.py=updater.py',
            '--include-data-files=license.py=license.py',
            '--include-data-files=tools_setup.py=tools_setup.py',
            '--include-data-files=kadrik.py=kadrik.py',
            '--include-data-files=requirements.txt=requirements.txt',
            '--include-data-files=icon.ico=icon.ico',
            '--output-filename=Kadrik.exe',
            '--output-dir=dist'
          )
          python -m nuitka @args kadrik.py

      - name: Rename folder and main EXE to Russian demo name
        shell: pwsh
        run: |
          # Nuitka standalone кладёт результат в dist\kadrik.dist
          $distDir = 'dist\kadrik.dist'
          if (-not (Test-Path $distDir)) {
            Write-Host '[!] Папка сборки не найдена:' $distDir
            Get-ChildItem dist | Select-Object -First 30
            exit 1
          }
          # Переименуем папку в понятное имя
          Rename-Item -LiteralPath $distDir -NewName 'Kadrik' -Force
          $newDir = 'dist\Kadrik'
          # Переименуем главный .exe в русское демо-имя (Кадрик)
          $c = [char[]](0x041A,0x0430,0x0434,0x0440,0x0438,0x043A)
          $name = 'Demo ' + (-join $c) + '.exe'
          Rename-Item -LiteralPath (Join-Path $newDir 'Kadrik.exe') -NewName $name -Force
          Write-Host ('[OK] ' + $newDir + '\' + $name)

      - name: Sign main EXE with own certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Evgeniy Mamonov" -KeyUsage DigitalSignature -FriendlyName "Mamonov Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          $exe = Get-ChildItem 'dist\Kadrik\*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Package folder into ZIP
        shell: pwsh
        run: |
          $c = [char[]](0x041A,0x0430,0x0434,0x0440,0x0438,0x043A)
          $zip = 'dist\Demo ' + (-join $c) + '.zip'
          Compress-Archive -Path 'dist\Kadrik' -DestinationPath $zip -Force
          Write-Host ('[OK] ' + $zip)
          Get-ChildItem dist\*.zip | ForEach-Object { Write-Host ('   ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          # Главный exe с кириллическим именем (строим из кодов символов)
          $c = [char[]](0x041A,0x0430,0x0434,0x0440,0x0438,0x043A)
          $exeName = 'Demo ' + (-join $c) + '.exe'   # Demo Кадрик.exe
          $appTitle = (-join $c)                      # Кадрик

          # Собираем .iss скрипт построчно (без here-string, чтобы не ломать YAML)
          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Kadrik',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ustanovka Demo Kadrik',
            'SetupIconFile=dist\Kadrik\icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '[Files]',
            'Source: "dist\Kadrik\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\$appTitle`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\$appTitle`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent"
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer.iss", $iss, $utf8bom)

          # Находим ISCC.exe (Inno Setup предустановлен на windows-latest)
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка установщика не удалась'; exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign installer with own certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Evgeniy Mamonov" -KeyUsage DigitalSignature -FriendlyName "Mamonov Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          $exe = Get-ChildItem 'dist\Ustanovka*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kadrik-Nuitka-Folder
          path: |
            dist/*.zip
            dist/Ustanovka*.exe
          if-no-files-found: error

      - name: Publish to rolling release (auto-build-nuitka)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-nuitka
          name: "\u0410\u0432\u0442\u043e\u0441\u0431\u043e\u0440\u043a\u0430 Nuitka \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u044f\u044f \u0432\u0435\u0440\u0441\u0438\u044f"
          body: "\u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0431\u043e\u0440\u043a\u0430 \u041a\u0430\u0434\u0440\u0438\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 Nuitka. \u041e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u0439 \u0441\u0431\u043e\u0440\u043a\u0435."
          files: |
            dist/*.zip
            dist/Ustanovka*.exe
          make_latest: true
