name: Key diag3
on:
  push:
    branches: [ master ]
    paths: [ 'diag3.txt' ]
jobs:
  key:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build activation key
        shell: pwsh
        run: |
          Write-Host 'START'
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_key.ps1
          Write-Host ('EXIT=' + $LASTEXITCODE)
          Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ('FILE ' + $_.Name + ' ' + $_.Length) }
          if (-not (Test-Path 'dist/Kadrik-Unlock.exe')) { Write-Host '[!] нет ключа'; exit 1 }
